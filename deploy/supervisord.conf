[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/youngcha-supervisord.pid
user=root

[program:web]
command=/usr/local/bin/gunicorn coffee.wsgi:application --bind 0.0.0.0:%(ENV_PORT)s --workers 2 --worker-class sync --timeout 30 --no-control-socket
user=youngcha
directory=/app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:expiry]
command=/usr/local/bin/python /app/manage.py expire_orders
user=youngcha
directory=/app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
