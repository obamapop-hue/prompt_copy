{% extends 'orders/base.html' %}{% block content %}<main class="container"><div class="panel login-box"><h2>{% if role == 'seller' %}판매자{% else %}운영자{% endif %} 로그인</h2>{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="post">{% csrf_token %}<label for="username">계정명</label><input id="username" name="username" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" name="password" autocomplete="current-password" required><button>로그인</button></form></div></main>{% endblock %}
